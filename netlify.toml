[build]
  base = "beam-and-plan"
  command = "npm run check && npm run build && npm test"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  SITE_URL = "https://beamandplan.com"
  FORM_BACKEND = "netlify"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"
